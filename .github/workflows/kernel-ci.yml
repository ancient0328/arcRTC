name: Kernel CI

on:
  push:
    branches:
      - main
      - upload
  pull_request:
    branches:
      - main
      - upload

concurrency:
  group: kernel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KERNEL_GATE_MATRIX_SOURCE: Kernel/tools/ci/kernel-gate-matrix.toml

jobs:
  kernel-rust:
    name: kernel-rust / ${{ matrix.command_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - command_family: cargo-fmt-check
            command_id: cargo-fmt-check
          - command_family: cargo-clippy-workspace
            command_id: cargo-clippy-workspace
          - command_family: cargo-test-workspace
            command_id: cargo-test-workspace
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select stable Rust
        run: rustup default stable

      - name: Resolve matrix source reference
        id: resolve
        env:
          MATRIX_JOB_ID: kernel-rust
          MATRIX_COMMAND_FAMILY: ${{ matrix.command_family }}
          MATRIX_COMMAND_ID: ${{ matrix.command_id }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open(os.environ["KERNEL_GATE_MATRIX_SOURCE"], "rb") as matrix_file:
              matrix = tomllib.load(matrix_file)
          for command in matrix["commands"]:
              if command["job_id"] == os.environ["MATRIX_JOB_ID"] and command["command_id"] == os.environ["MATRIX_COMMAND_ID"]:
                  if command["command_family"] != os.environ["MATRIX_COMMAND_FAMILY"]:
                      raise SystemExit("command family mismatch")
                  print(f"job_id={command['job_id']}")
                  print(f"command_family={command['command_family']}")
                  print(f"command_id={command['command_id']}")
                  print(f"gate_class={command['gate_class']}")
                  print(f"working_directory={command['working_directory']}")
                  print(f"command_line={command['command_line']}")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write(f"working_directory=Kernel/{command['working_directory']}\n")
                      output.write(f"command_line={command['command_line']}\n")
                  raise SystemExit(0)
          raise SystemExit("matrix command reference not found")
          PY

      - name: Run matrix command
        working-directory: ${{ steps.resolve.outputs.working_directory }}
        run: ${{ steps.resolve.outputs.command_line }}

