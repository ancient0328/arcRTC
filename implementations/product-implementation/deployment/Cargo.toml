[package]
name = "arcrtc-product-deployment"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
arcrtc-core-configuration = { path = "../../../Kernel/core/configuration" }
arcrtc-core-operation = { path = "../../../Kernel/core/operation" }
arcrtc-core-runtime = { path = "../../../Kernel/core/runtime" }
arcrtc-core-identity = { path = "../../../Kernel/core/identity" }
arcrtc-implementation-evidence = { path = "../../implementation-support/evidence" }
arcrtc-product-rollback = { path = "../rollback" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
