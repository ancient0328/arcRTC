[package]
name = "arcrtc-implementation-benchmark-tests"
version = "0.0.0"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[workspace]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]
arcrtc-core-identity = { path = "../../../Kernel/core/identity" }
arcrtc-core-sfu = { path = "../../../Kernel/core/sfu" }
arcrtc-core-signaling = { path = "../../../Kernel/core/signaling" }
arcrtc-core-turn = { path = "../../../Kernel/core/turn" }
arcrtc-implementation-evidence = { path = "../../implementation-support/evidence" }
arcrtc-product-deployment = { path = "../../product-implementation/deployment" }
arcrtc-product-persistence-topology = { path = "../../product-implementation/persistence-topology" }
arcrtc-product-policy = { path = "../../product-implementation/product-policy" }
arcrtc-product-rollback = { path = "../../product-implementation/rollback" }
arcrtc-reference-composition = { path = "../../reference-implementation/composition" }
arcrtc-reference-ops = { path = "../../reference-implementation/ops" }
arcrtc-reference-sfu = { path = "../../reference-implementation/sfu" }
arcrtc-reference-signaling = { path = "../../reference-implementation/signaling" }
arcrtc-reference-turn = { path = "../../reference-implementation/turn" }
criterion = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "benchmark_scenarios"
harness = false
