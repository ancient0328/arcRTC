[package]
name = "arcrtc-core-runtime"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.arcrtc]
owner_layer = "core"
package_role = "runtime clock randomness abstraction surface"
allowed_dependency_direction = "core must not depend on drivers or entrypoints"
dependency_class = "core_semantic_dependency"

[lib]
path = "src/lib.rs"

[dependencies]
arcrtc-core-identity = { path = "../identity" }
