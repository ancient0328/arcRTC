[package]
name = "arcrtc-core-signaling"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.arcrtc]
owner_layer = "core"
package_role = "signaling contract surface"
allowed_dependency_direction = "core must not depend on drivers or entrypoints"
dependency_class = "core_semantic_dependency"

[lib]
path = "src/lib.rs"

[dependencies]
arcrtc-core-command = { path = "../command" }
arcrtc-core-identity = { path = "../identity" }
arcrtc-core-security = { path = "../security" }
arcrtc-core-transport = { path = "../transport" }
