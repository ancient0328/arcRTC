[package]
name = "arcrtc-driver-webrtc-str0m"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.arcrtc]
owner_layer = "drivers"
package_role = "webrtc transport driver surface"
allowed_dependency_direction = "drivers may depend on core and must not depend on entrypoints"
dependency_class = "driver_implementation_dependency"

[lib]
path = "src/lib.rs"

[dependencies]
arcrtc-core-ports = { path = "../../core/ports" }
arcrtc-core-quality = { path = "../../core/quality" }
arcrtc-core-transport = { path = "../../core/transport" }
