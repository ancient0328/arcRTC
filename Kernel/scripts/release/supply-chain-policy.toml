# release artifact の source policy です。

[dependency_admission]
owner = "scripts/release"
policy_id = "dependency-admission"
admission_mode = "closed-allowlist"
required_manifest_sources = ["Cargo.lock", "sdk/typescript/pnpm-lock.yaml", "sdk/ios/Package.resolved", "sdk/android/gradle.lockfile"]

[license_admission]
owner = "scripts/release"
policy_id = "license-admission"
allowed_license_classes = ["permissive", "weak-copyleft-with-notice", "internal"]
denied_license_classes = ["strong-copyleft", "proprietary-unknown", "unclassified"]

[vulnerability_gate]
owner = "scripts/release"
policy_id = "vulnerability-gate"
severity_classes = ["critical", "high", "medium", "low"]
release_blocking_severities = ["critical", "high"]

[sbom]
owner = "scripts/release"
policy_id = "sbom"
required_formats = ["spdx-json", "cyclonedx-json"]
required_scope = ["rust-workspace", "typescript-sdk", "android-sdk", "ios-sdk"]

[artifact_digest]
owner = "scripts/release"
policy_id = "artifact-digest"
digest_algorithms = ["sha256"]
required_digest_fields = ["artifact_name", "artifact_digest", "digest_algorithm"]

[artifact_signature]
owner = "scripts/release"
policy_id = "artifact-signature"
signature_ref_required = true
signature_ref_classes = ["sigstore-bundle-ref", "kms-signature-ref", "detached-signature-ref"]

[provenance]
owner = "scripts/release"
policy_id = "provenance"
required_fields = ["source_snapshot", "provenance_ref"]
provenance_ref_classes = ["slsa-provenance-ref", "github-attestation-ref", "internal-build-record-ref"]
