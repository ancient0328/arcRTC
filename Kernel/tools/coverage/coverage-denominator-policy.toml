# coverage denominator と threshold の source policy です。

[denominator]
owner = "tools/coverage"
policy_id = "coverage-denominator"
scope = ["kernel-rust-workspace", "sdk-typescript", "sdk-android", "sdk-ios"]
unit = "assertion"

[assertion_classification]
owner = "tools/coverage"
allowed_classification = ["assertion-bearing", "structural-only", "excluded-with-reason"]
default_classification = "assertion-bearing"
closed_set = true

[exclusion_policy]
owner = "tools/coverage"
allowed_exclusion_reasons = ["generated-source", "non-executable-schema", "external-tool-wrapper", "documentation-only"]
reason_required = true
unknown_reason_allowed = false

[floor]
owner = "tools/coverage"
line_floor_percent = 90
branch_floor_percent = 85
assertion_floor_percent = 100

[command]
owner = "tools/coverage"
coverage_command_id = "coverage-denominator-check"
