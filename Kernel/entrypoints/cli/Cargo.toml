[package]
name = "arcrtc-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.arcrtc]
owner_layer = "entrypoints"
package_role = "cli composition surface"
allowed_dependency_direction = "entrypoints may depend on core and selected drivers"
dependency_class = "entrypoint_composition_dependency"

[[bin]]
name = "arcrtc"
path = "src/main.rs"

[dependencies]
arcrtc-core-command = { path = "../../core/command" }
arcrtc-core-reason = { path = "../../core/reason" }
