[package]
name = "arcrtc-entrypoint-live-server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.arcrtc]
owner_layer = "entrypoints"
package_role = "live public probe server surface"
allowed_dependency_direction = "entrypoints may expose process I/O surfaces without owning domain authority"
dependency_class = "entrypoint_probe_dependency"

[lib]
path = "src/lib.rs"

[[bin]]
name = "arcrtc-entrypoint-live-server"
path = "src/main.rs"

[dependencies]
arcrtc-core-reason = { path = "../../core/reason" }
