[package]
name = "arcrtc-sfu-server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.arcrtc]
owner_layer = "entrypoints"
package_role = "sfu server composition surface"
allowed_dependency_direction = "entrypoints may depend on core and selected drivers"
dependency_class = "entrypoint_composition_dependency"

[[bin]]
name = "arcrtc-sfu-server"
path = "src/main.rs"

[dependencies]
arcrtc-entrypoint-composition-root = { path = "../composition-root" }

[dev-dependencies]
arcrtc-core-identity = { path = "../../core/identity" }
arcrtc-core-runtime = { path = "../../core/runtime" }
arcrtc-core-sfu = { path = "../../core/sfu" }
