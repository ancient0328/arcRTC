[package]
name = "arcrtc-reference-ops"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
arcrtc-core-command = { path = "../../../Kernel/core/command" }
arcrtc-core-operation = { path = "../../../Kernel/core/operation" }
arcrtc-core-runtime = { path = "../../../Kernel/core/runtime" }
arcrtc-core-identity = { path = "../../../Kernel/core/identity" }
arcrtc-distro-evidence = { path = "../../distro-support/evidence" }
arcrtc-reference-composition = { path = "../composition" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive"] }
